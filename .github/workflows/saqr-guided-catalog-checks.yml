name: Saqr Guided Catalog Safety Checks
on:
  push:
    branches:
      - fix/saqr-guided-catalog-20261024
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-save --package-lock=false --no-audit --no-fund
      - name: Existing Saqr safeguards
        run: node --experimental-strip-types tests/saqrSafeEnhancements.test.ts
      - name: Catalog, discussion and identity regression tests
        run: node --experimental-strip-types tests/saqrGuidedCatalog.test.ts
      - name: Typecheck Saqr utilities
        run: npx tsc --noEmit --skipLibCheck --moduleResolution bundler --module esnext --target es2022 --allowImportingTsExtensions src/utils/saqrCatalogSearch.ts src/utils/saqrSafeEnhancements.ts tests/saqrGuidedCatalog.test.ts tests/saqrSafeEnhancements.test.ts
      - name: Production Vite build
        run: npm run build
