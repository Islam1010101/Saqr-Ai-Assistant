name: Saqr Safe Reading Preview
on:
  push:
    branches:
      - saqr-safe-reading-preview-20261024
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Existing repository lockfile predates package.json; keep it unchanged.
      - run: npm install --no-save --package-lock=false --no-audit --no-fund
      - name: Run Saqr regression checks (no AI API calls)
        run: node --experimental-strip-types tests/saqrSafeEnhancements.test.ts
      - name: Typecheck only new Saqr files
        run: npx tsc --noEmit --skipLibCheck --moduleResolution bundler --module esnext --target es2022 --allowImportingTsExtensions src/utils/saqrSafeEnhancements.ts tests/saqrSafeEnhancements.test.ts
      - name: Verify Vite build
        run: npm run build
