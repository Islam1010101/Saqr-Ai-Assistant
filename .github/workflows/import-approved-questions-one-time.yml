,"sha":"c3ffda66eb4b20489b51843de1ae48fd755b7491"}];
            const {owner, repo} = context.repo;
            const ref = await github.rest.git.getRef({owner, repo, ref: 'heads/' + branch});
            const base = ref.data.object.sha;
            const original = await github.rest.git.getCommit({owner, repo, commit_sha: base});
