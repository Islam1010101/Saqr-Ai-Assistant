      - 'src/components/DigitalBookReader.tsx'
      - 'src/components/digitalBookReader.css'
      - 'src/utils/saqrCatalogSearch.ts'
      - 'src/utils/saqrCatalogReply.ts'
      - 'tests/saqrDigitalReferrals.test.ts'
      - 'tests/pdfReader.test.ts'
      - 'tools/testPdfReader.mjs'
      - '.github/workflows/digital-pdf-reader-regression.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run test:pdf-reader
      - run: node --experimental-strip-types tests/saqrDigitalReferrals.test.ts
      - run: node --experimental-strip-types tests/newEnglishDriveBooks.test.ts
      - run: node --experimental-strip-types tests/englishNewViewOnlyPending.test.ts
      - run: node --experimental-strip-types tests/schoolDriveEmbeddedReader.test.ts
      - run: node --experimental-strip-types tests/codingImageBookPilot.test.ts
      - run: node --experimental-strip-types tests/completedEnglishImageBooks.test.ts
      - run: node --experimental-strip-types tests/remainingEnglishImageBooks.test.ts
      - run: node --experimental-strip-types tests/verifiedArabicPhotoBooks.test.ts
      - run: node --experimental-strip-types tests/photoOnlyArabicCatalog.test.ts
      - run: node --experimental-strip-types tests/schoolDrivePdfRanges.test.ts
      - run: npm run build
