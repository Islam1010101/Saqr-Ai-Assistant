name: Identity catalog visual cleanup
on:
  push:
    branches: [fix/identity-catalog-hide-subtitle-total-20261026]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --no-audit --no-fund
      - run: node --experimental-strip-types tests/identityCatalogVisual.test.ts
      - run: npm run build
