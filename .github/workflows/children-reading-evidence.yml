name: EFIPS children reading evidence
on:
  pull_request:
    paths:
      - 'api/bookAudience.ts'
      - 'api/childrenReadingReferences.ts'
      - 'pages/SearchPage.tsx'
      - 'tests/childrenReadingLevels.test.ts'
      - 'docs/children-reading-evidence-pilot-20261106.md'
      - '.github/workflows/children-reading-evidence.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: node --experimental-strip-types tests/childrenReadingLevels.test.ts
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build
