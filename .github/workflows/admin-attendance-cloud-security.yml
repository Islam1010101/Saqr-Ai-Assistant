name: Isolated attendance cloud security checks
on:
  push:
    branches:
      - feat/admin-attendance-cloud-secure-20261026
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-save --package-lock=false --no-audit --no-fund
      - run: node --experimental-strip-types tests/adminLibraryAttendance.test.ts
      - run: node --experimental-strip-types tests/adminAttendanceCloudIsolation.test.ts
      - run: node --experimental-strip-types tests/adminAttendanceCloudSecurity.test.ts
      - run: npm run build
