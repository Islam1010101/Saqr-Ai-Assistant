name: IELTS preparation center and Saqr self-test isolation

on:
  pull_request:
    paths:
      - "src/data/ieltsResources.ts"
      - "pages/IeltsPreparationCenterPage.tsx"
      - "pages/EnglishLibraryInternalPage.tsx"
      - "pages/DigitalLibraryPage.tsx"
      - "pages/SmartSearchPage.tsx"
      - "src/components/IeltsSaqrEntry.tsx"
      - "src/components/IeltsReadingWritingPractice.tsx"
      - "src/utils/ieltsExamPractice.ts"
      - "tests/ieltsReadingWritingSpeaking.test.mjs"
      - "src/components/IeltsListeningPractice.tsx"
      - "src/data/ieltsListeningLessons.ts"
      - "src/data/ieltsListeningExpanded.ts"
      - "src/utils/ieltsListeningGrading.ts"
      - "tests/ieltsGradedListening.test.mjs"
      - "tests/ieltsListeningGrading.test.ts"
      - "src/utils/ieltsListeningReview.ts"
      - "tests/ieltsListeningLibrary.test.mjs"
      - "src/utils/ieltsSaqrPractice.ts"
      - "tests/ieltsSaqrCoreIsolation.test.mjs"
      - "tests/ieltsNoLessonReports.test.mjs"
      - "App.tsx"
      - "src/components/GoogleSchoolReturn.tsx"
      - "tests/ieltsCenter.test.mjs"
      - "tests/ieltsReaderViewOnly.test.mjs"
      - "src/components/DigitalBookReader.tsx"
      - "src/components/IeltsDriveViewOnlyReader.tsx"
      - "src/components/digitalBookReader.css"
      - ".github/workflows/ielts-center.yml"
  push:
    branches:
      - "feat/ielts-preparation-center-20261115"
      - "feat/ielts-saqr-self-test-20261115"
      - "fix/ielts-view-only-school-access-20261115"
      - "fix/ielts-drive-viewer-first-20261115"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Saqr, challenges, auth and all legacy readers are unchanged
        run: |
          git fetch --no-tags --depth=1 origin 6371f2bb8080674c268a1b64a105be18bc02f4f3
          git fetch --no-tags --depth=1 origin fa6c9a6a47ae5f1deb43e1cdd5e57b84aa931f5c
          git diff --exit-code 6371f2bb8080674c268a1b64a105be18bc02f4f3 HEAD -- \
            pages/SaqrReadingQuestPage.tsx \
            pages/SaqrChallengesHubPage.tsx pages/FlagDayChallenge.tsx \
            pages/NationalIdentityPage.tsx pages/SaqrLearningPage.tsx \
            pages/game.tsx src/components/GoogleSchoolReturn.tsx \
            src/components/GoogleTeacherReturn.tsx \
            src/components/EnglishPhotoBookReader.tsx api/chat.ts \
            api/digitalBookData.ts supabase/functions/
          git diff --exit-code 6371f2bb8080674c268a1b64a105be18bc02f4f3 HEAD -- src/utils/ ':(exclude)src/utils/ieltsSaqrPractice.ts' ':(exclude)src/utils/ieltsListeningReview.ts' ':(exclude)src/utils/ieltsListeningGrading.ts' ':(exclude)src/utils/ieltsExamPractice.ts'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: node --test tests/ieltsCenter.test.mjs tests/ieltsSaqrCoreIsolation.test.mjs tests/ieltsReaderViewOnly.test.mjs tests/ieltsListeningLibrary.test.mjs tests/ieltsGradedListening.test.mjs tests/ieltsReadingWritingSpeaking.test.mjs tests/ieltsNoLessonReports.test.mjs
      - run: node --experimental-strip-types tests/ieltsListeningGrading.test.ts
      - run: npm run build
