name: EFIPS per-user features and strict Saqr isolation
on:
  pull_request:
    paths:
      - "App.tsx"
      - "pages/AdminDashboard.tsx"
      - "pages/NationalIdentityPage.tsx"
      - "pages/NationalAnthemChallengePage.tsx"
      - "pages/SaqrChallengesHubPage.tsx"
      - "pages/SaqrLearningPage.tsx"
      - "src/components/AdminUserFeaturePermissions.tsx"
      - "src/components/SchoolFeatureRoute.tsx"
      - "src/components/StudentLibraryScheduleView.tsx"
      - "src/components/SaqrOrbitNavigation.tsx"
      - "src/utils/efipsFeatures.ts"
      - "src/utils/efipsFeatureAccess.ts"
      - "src/utils/saqrLearningAccess.ts"
      - "supabase/functions/efips-feature-access/index.ts"
      - "supabase/functions/saqr-learning-access/index.ts"
      - "supabase/migrations/20261116081000_efips_user_feature_overrides.sql"
      - "tests/efipsFeatureAccess.test.mjs"
      - "tests/nationalIdentityHR040.test.ts"
      - ".github/workflows/efips-feature-access.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify old AI, timetable bookings and library logic are byte-identical
        run: git fetch --no-tags --depth=1 origin 351e42227e089b74317660e7819fd1b85131aedc
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: node --test tests/efipsFeatureAccess.test.mjs tests/ieltsCenter.test.mjs tests/ieltsSaqrCoreIsolation.test.mjs tests/ieltsReaderViewOnly.test.mjs
      - run: node --experimental-strip-types tests/nationalIdentityHR040.test.ts
      - run: node --experimental-strip-types tests/nationalAnthemChallenge.test.ts
      - run: node --experimental-strip-types tests/saqrLearningAccess.test.ts
      - run: npm run build
