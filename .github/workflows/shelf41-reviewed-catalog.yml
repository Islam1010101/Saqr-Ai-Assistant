name: Shelf 41 reviewed catalog checks
on:
  push:
    branches: [feat/shelf41-reviewed-catalog-20261026]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-save --package-lock=false --no-audit --no-fund
      - run: node --experimental-strip-types tests/shelf41ReviewedCatalog.test.ts
      - run: node --experimental-strip-types tests/libraryShelfRelocation.test.ts
      - run: npm run build
