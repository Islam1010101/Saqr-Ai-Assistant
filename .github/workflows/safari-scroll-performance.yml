name: EFIPS scroll performance regression
on:
  pull_request:
    paths:
      - 'App.tsx'
      - 'pages/HomePage.tsx'
      - 'pages/TutorialPage.tsx'
      - 'pages/ArabicLibraryInternalPage.tsx'
      - 'pages/EnglishLibraryInternalPage.tsx'
      - 'pages/DigitalLibraryPage.tsx'
      - 'tests/safariScrollPerformance.test.ts'
      - '.github/workflows/safari-scroll-performance.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: node --experimental-strip-types tests/safariScrollPerformance.test.ts
      - run: node --experimental-strip-types tests/homeTeacherSchedule.test.ts
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build
