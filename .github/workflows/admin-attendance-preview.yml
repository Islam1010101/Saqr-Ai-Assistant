name: Admin attendance preview validation
on:
  push:
    branches:
      - feat/admin-library-attendance-preview-20261026
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-save --package-lock=false --no-audit --no-fund
      - run: node --experimental-strip-types tests/adminLibraryAttendance.test.ts
      - run: npx tsc --noEmit --skipLibCheck --moduleResolution bundler --module esnext --target es2022 --allowImportingTsExtensions src/utils/adminLibraryAttendance.ts tests/adminLibraryAttendance.test.ts
      - run: npm run build
