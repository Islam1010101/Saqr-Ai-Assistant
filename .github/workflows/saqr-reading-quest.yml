name: EFIPS Saqr reading challenge validation
on:
  push:
    branches: [feat/flag-five-second-shelves35-37-20261028]
  pull_request:
    paths:
      - 'pages/SaqrReadingQuestPage.tsx'
      - 'pages/SaqrChallengesHubPage.tsx'
      - 'pages/HomePage.tsx'
      - 'pages/TutorialPage.tsx'
      - 'src/components/HomeReadingHub.tsx'
      - 'pages/NationalIdentityPage.tsx'
      - 'pages/NationalAnthemChallengePage.tsx'
      - 'pages/nationalIdentityLanding.css'
      - 'pages/nationalAnthemChallenge.css'
      - 'src/components/SaqrOrbitNavigation.tsx'
      - 'src/utils/nationalIdentityAccess.ts'
      - 'App.tsx'
      - 'src/utils/saqrReadingQuestBank.ts'
      - 'src/utils/saqrReadingQuestDigitalBank.ts'
      - 'src/utils/saqrReadingQuestHeritageSources.ts'
      - 'src/utils/saqrReadingQuestDriveTextSources.ts'
      - 'src/utils/saqrReadingQuestArabicDigitalSources.ts'
      - 'src/utils/saqrReadingQuestEnglishDigitalSources.ts'
      - 'api/digitalBookData.ts'
      - 'api/nationalIdentityDigitalBooks.ts'
      - 'tests/saqrReadingQuest.test.ts'
      - 'tests/nationalIdentityHR040.test.ts'
      - 'tests/nationalAnthemChallenge.test.ts'
      - 'tests/homeReadingHubDigitalType.test.ts'
      - 'tests/flagTimerAndBooks.test.ts'
      - '.github/workflows/saqr-reading-quest.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      # The existing repository lock file predates several package.json dependencies.
      # Avoid changing the production lockfile as part of this isolated feature.
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: node --experimental-strip-types tests/nationalIdentityHR040.test.ts
      - run: node --experimental-strip-types tests/nationalAnthemChallenge.test.ts
      - run: node --experimental-strip-types tests/homeReadingHubDigitalType.test.ts
      - run: node --import ./tools/registerTsResolver.mjs --experimental-strip-types tests/saqrReadingQuest.test.ts
      - run: node --import ./tools/registerTsResolver.mjs --experimental-strip-types tests/shelf30Catalog.test.ts
      - run: node --import ./tools/registerTsResolver.mjs --experimental-strip-types tests/saqrIntroduction.test.ts
      - run: node --import ./tools/registerTsResolver.mjs --experimental-strip-types tests/flagTimerAndBooks.test.ts
      - run: npm run build
