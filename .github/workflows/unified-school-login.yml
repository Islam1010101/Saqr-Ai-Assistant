name: EFIPS unified school login validation
on:
  pull_request:
    paths:
      - 'pages/Login.tsx'
      - 'App.tsx'
      - 'src/components/GoogleSchoolReturn.tsx'
      - 'supabase/functions/google-school-login/**'
      - 'tests/unifiedSchoolLogin.test.ts'
      - '.github/workflows/unified-school-login.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: node --experimental-strip-types tests/unifiedSchoolLogin.test.ts
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build
