name: Saqr content and podcast regression checks
on:
  push:
    branches: [feat/flag-tutorial-podcast-20261026]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types tests/flagPodcastUpdates.test.ts
      - run: npm run build
