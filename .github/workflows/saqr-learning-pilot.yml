name: Saqr private learning pilot validation
on:
  pull_request:
    paths:
      - 'App.tsx'
      - 'pages/HomePage.tsx'
      - 'pages/SaqrLearningPage.tsx'
      - 'src/components/SaqrLearningEntry.tsx'
      - 'src/utils/saqrLearningAccess.ts'
      - 'supabase/functions/saqr-learning-access/index.ts'
      - 'tests/saqrLearningAccess.test.ts'
      - '.github/workflows/saqr-learning-pilot.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: node --experimental-strip-types tests/saqrLearningAccess.test.ts
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build
