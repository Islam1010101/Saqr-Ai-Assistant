name: Source first heritage validation
on:
  push:
    branches: [feat/source-first-heritage-three-challenges-20261027, fix/detective-ten-random-questions-20261027]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --no-audit --no-fund
      - run: node --experimental-strip-types tests/heritageEvidence.test.ts
      - run: node --experimental-strip-types tests/handhalPrintedDictionary.test.ts
      - run: node --experimental-strip-types tests/detectiveTenRound.test.ts
      - run: npm run build
