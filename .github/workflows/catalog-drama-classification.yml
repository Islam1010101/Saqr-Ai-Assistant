name: EFIPS physical catalog drama classification
on:
  pull_request:
    paths:
      - 'api/bookData.ts'
      - 'tests/dramaCatalogClassification.test.ts'
      - 'src/utils/literaryGenreCatalog.ts'
      - 'pages/SearchPage.tsx'
      - 'tests/literaryGenreCatalog.test.ts'
      - '.github/workflows/catalog-drama-classification.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: node --experimental-strip-types tests/dramaCatalogClassification.test.ts
      - run: node --experimental-strip-types tests/literaryGenreCatalog.test.ts
      - run: node --experimental-strip-types tests/shelf30Catalog.test.ts
      - run: node --experimental-strip-types tests/shelf22Catalog.test.ts
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build
