name: EFIPS Saqr reading challenge validation
on:
  push:
    branches: [feat/efips-challenges-color-quiz-focus-20261028]
  pull_request:
    paths:
      - 'pages/SaqrReadingQuestPage.tsx'
      - 'pages/SaqrChallengesHubPage.tsx'
      - 'pages/HomePage.tsx'
      - 'src/utils/saqrReadingQuestBank.ts'
      - 'tests/saqrReadingQuest.test.ts'
      - '.github/workflows/saqr-reading-quest.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      # The existing repository lock file predates several package.json dependencies.
      # Avoid changing the production lockfile as part of this isolated feature.
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: node --experimental-strip-types tests/saqrReadingQuest.test.ts
      - run: npm run build
