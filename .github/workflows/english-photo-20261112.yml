name: EFIPS current English Drive photo collection verification
on:
  pull_request:
    paths:
      - 'src/data/englishPhotoMeta/**'
      - 'src/data/englishPhotoPages/**'
      - 'src/data/englishPhotoLibrary20261111.ts'
      - 'src/data/englishBookEditorial20261112.ts'
      - 'src/components/EnglishPhotoBookReader.tsx'
      - 'api/digitalBookData.ts'
      - 'src/data/digitalSeriesVolumes.js'
      - 'tests/catalogAuditCounts.test.ts'
      - 'pages/EnglishLibraryInternalPage.tsx'
      - 'tests/englishPhotoDrive20261112.test.ts'
      - '.github/workflows/english-photo-20261112.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/englishPhotoMeta/**'
      - 'src/data/englishPhotoPages/**'
      - 'src/data/englishPhotoLibrary20261111.ts'
      - 'src/data/englishBookEditorial20261112.ts'
      - 'src/components/EnglishPhotoBookReader.tsx'
      - 'pages/EnglishLibraryInternalPage.tsx'
      - 'tests/englishPhotoDrive20261112.test.ts'
jobs:
  catalog-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: node --import ./tools/registerTsResolver.mjs --experimental-strip-types tests/englishPhotoDrive20261112.test.ts
      - run: node --import ./tools/registerTsResolver.mjs --experimental-strip-types tests/catalogAuditCounts.test.ts
      - run: npm run build
