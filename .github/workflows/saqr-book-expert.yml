name: EFIPS Saqr veteran librarian bibliography validation
on:
  pull_request:
    paths:
      - 'src/utils/saqrBookExpert.ts'
      - 'src/utils/saqrFollowUp.ts'
      - 'src/utils/saqrNaturalDialogue.ts'
      - 'src/utils/saqrCatalogReply.ts'
      - 'src/utils/saqrCatalogSearch.ts'
      - 'api/bookData.ts'
      - 'tests/saqrSpaceRecommendations.test.ts'
      - 'src/utils/saqrRecommendationPresentation.ts'
      - 'tests/saqrRecommendationPresentation.test.ts'
      - 'src/utils/saqrExternalRecommendations.ts'
      - 'tests/saqrExternalRecommendations.test.ts'
      - 'src/utils/saqrIntentRouter.ts'
      - 'tests/saqrIntentStoryCertificate.test.ts'
      - 'src/utils/saqrProofreading.ts'
      - 'tests/saqrProofreadingCertificate.test.ts'
      - 'tests/saqrNaturalDialogue.test.ts'
      - 'tests/saqrFollowUp.test.ts'
      - 'pages/SmartSearchPage.tsx'
      - 'api/chat.ts'
      - 'src/utils/saqrOpenLibrary.js'
      - 'tests/saqrBookExpert.test.ts'
      - '.github/workflows/saqr-book-expert.yml'
  push:
    branches: [main]
    paths:
      - 'src/utils/saqrBookExpert.ts'
      - 'src/utils/saqrFollowUp.ts'
      - 'src/utils/saqrNaturalDialogue.ts'
      - 'src/utils/saqrCatalogReply.ts'
      - 'src/utils/saqrCatalogSearch.ts'
      - 'api/bookData.ts'
      - 'tests/saqrSpaceRecommendations.test.ts'
      - 'src/utils/saqrRecommendationPresentation.ts'
      - 'tests/saqrRecommendationPresentation.test.ts'
      - 'src/utils/saqrExternalRecommendations.ts'
      - 'tests/saqrExternalRecommendations.test.ts'
      - 'src/utils/saqrIntentRouter.ts'
      - 'tests/saqrIntentStoryCertificate.test.ts'
      - 'src/utils/saqrProofreading.ts'
      - 'tests/saqrProofreadingCertificate.test.ts'
      - 'tests/saqrNaturalDialogue.test.ts'
      - 'tests/saqrFollowUp.test.ts'
      - 'pages/SmartSearchPage.tsx'
      - 'api/chat.ts'
      - 'src/utils/saqrOpenLibrary.js'
      - 'tests/saqrBookExpert.test.ts'
      - '.github/workflows/saqr-book-expert.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: node --experimental-strip-types tests/saqrBookExpert.test.ts
      - run: node --experimental-strip-types tests/saqrFollowUp.test.ts
      - run: node --experimental-strip-types tests/saqrNaturalDialogue.test.ts
      - run: node --experimental-strip-types tests/saqrSpaceRecommendations.test.ts
      - run: node --experimental-strip-types tests/saqrRecommendationPresentation.test.ts
      - run: node --experimental-strip-types tests/saqrExternalRecommendations.test.ts
      - run: node --experimental-strip-types tests/saqrIntentStoryCertificate.test.ts
      - run: node --experimental-strip-types tests/saqrProofreadingCertificate.test.ts
      - run: npm run build
