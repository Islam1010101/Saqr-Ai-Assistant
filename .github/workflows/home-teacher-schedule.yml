name: EFIPS teacher homepage schedule checks
on:
  pull_request:
    paths:
      - 'pages/HomePage.tsx'
      - 'pages/SchedulePage.tsx'
      - 'src/utils/teacherLibrarySchedule.ts'
      - 'tests/homeTeacherSchedule.test.ts'
      - '.github/workflows/home-teacher-schedule.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: node --experimental-strip-types tests/homeTeacherSchedule.test.ts
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build
