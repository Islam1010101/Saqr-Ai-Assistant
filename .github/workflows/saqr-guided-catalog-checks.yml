name: Saqr Guided Catalog Safety Checks
on:
  push:
    branches:
      - fix/saqr-guided-catalog-20261024
      - fix/saqr-readable-catalog-discussion-20261024
      - fix/saqr-learning-library-preview-20261024
      - fix/saqr-title-booking-followups-20261024
      - fix/saqr-uae-catalog-precision-20261024
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-save --package-lock=false --no-audit --no-fund
      - name: Existing Saqr safeguards
        run: node --experimental-strip-types tests/saqrSafeEnhancements.test.ts
      - name: Catalog, discussion and identity regression tests
        run: node --experimental-strip-types tests/saqrGuidedCatalog.test.ts
      - name: Verify safe rendering and catalog answers
        run: node --experimental-strip-types tests/saqrReadableCatalog.test.ts
      - name: Saqr research, tutoring and personal reading
        run: node --experimental-strip-types tests/saqrLearning.test.ts
      - name: Arabic-English titles, booking and tutoring regressions
        run: node --experimental-strip-types tests/saqrTitleBooking.test.ts
      - name: UAE digital catalog precision
        run: node --experimental-strip-types tests/saqrUaePrecision.test.ts
      - name: Typecheck Saqr utilities
        run: npx tsc --noEmit --skipLibCheck --moduleResolution bundler --module esnext --target es2022 --allowImportingTsExtensions src/utils/saqrCatalogSearch.ts src/utils/saqrSafeEnhancements.ts src/utils/saqrText.ts src/utils/saqrCatalogReply.ts src/utils/saqrLearning.ts src/utils/saqrReaderContext.ts tests/saqrGuidedCatalog.test.ts tests/saqrReadableCatalog.test.ts tests/saqrLearning.test.ts tests/saqrTitleBooking.test.ts tests/saqrUaePrecision.test.ts tests/saqrSafeEnhancements.test.ts
      - name: Production Vite build
        run: npm run build
