name: Validate EFIPS shelf 40 catalog
on:
  push:
    branches: [feat/shelf40-excel-catalog-20261027]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --no-audit --no-fund
      - run: node --experimental-strip-types tests/shelf40Catalog.test.ts
      - run: node --experimental-strip-types tests/libraryShelfRelocation.test.ts
      - run: npm run build
