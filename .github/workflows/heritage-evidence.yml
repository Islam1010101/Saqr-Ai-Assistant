name: Verify heritage source-grounded missions
on:
  push:
    branches: [feat/heritage-source-aligned-evidence-20261027]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --no-audit --no-fund
      - run: node --experimental-strip-types tests/heritageEvidence.test.ts
      - run: npm run build
